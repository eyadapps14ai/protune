<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Staff | Protune Auto Services</title><link rel="stylesheet" href="/styles.css"><link rel="icon" href="/logos/favicon.svg"><script src="/staff.js" defer></script></head><body><header><a href="/" class="brand"><img src="/logos/protune-horizontal-gold.svg" alt="Protune Auto Services"></a><span class="eyebrow">Staff workspace</span><button id="logout" class="button secondary hidden">Sign out</button></header><main class="staff-layout"><section id="login" class="form-panel" style="max-width:450px;margin:60px auto"><h1 style="font-size:35px;letter-spacing:-1px;margin-bottom:25px">Staff sign in</h1><form id="login-form"><label>Username<input name="username" autocomplete="username" required></label><label style="margin-top:15px">Password<input name="password" type="password" autocomplete="current-password" required></label><div id="login-error" class="error" role="alert"></div><button class="button">Sign in →</button></form><p class="muted" style="margin-top:25px">Staff accounts are created by the server administrator. There is no public registration.</p></section><section id="workspace" class="hidden"><h1 style="font-size:40px;letter-spacing:-1px">Branch operations</h1><div class="staff-tabs"><button data-tab="bookings">Bookings</button><button data-tab="contacts">Enquiries</button><button data-tab="settings">Configuration</button></div><p class="notice">Notifications are not connected. After changing an appointment, contact the customer directly. No message is sent automatically.</p><div id="staff-content"></div><div id="staff-message" role="status" class="notice hidden"></div></section></main></body></html>
